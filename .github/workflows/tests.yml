name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  web-manager:
    name: Web manager unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: web-manager/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: pytest -v

  reverse-proxy:
    name: Reverse proxy routing tests (nginx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image and run routing checks
        run: ./reverse-proxy/tests/test_routing.sh
