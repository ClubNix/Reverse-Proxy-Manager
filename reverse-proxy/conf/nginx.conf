user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include $NGINX_DIR/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, TLSv1 and TLSv1.1, ref: POODLE
    ssl_prefer_server_ciphers on;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ##
    # Logging Settings
    ##

    access_log $NGINX_LOG_DIR/access.log;
    error_log $NGINX_LOG_DIR/error.log;

    ##
    # Gzip Settings
    ##

    gzip off;

    ##
    # Virtual Host Configs
    ##

    include $NGINX_CONF_DIR/*.conf;

    ##
    # Unavailable pages
    ##

    # Disabled configurations: generated by the web manager. Each disabled
    # domain gets a server block that keeps its own certificate (so HSTS
    # does not hard-fail) and returns the "service unavailable" page.
    include $NGINX_CONF_DIR/*.unavailable;

    # Catch-all: requests whose Host / SNI matches no configuration land
    # here instead of the first loaded server block.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate $NGINX_DIR/default-ssl/default.crt;
        ssl_certificate_key $NGINX_DIR/default-ssl/default.key;

        # Healthcheck page
        location = /health.html {
            return 200 '<html lang="en"><head><title>Healthcheck</title></head><body><h1>OK</h1></body></html>';
        }

        include $NGINX_DIR/unavailable.inc;
    }
}