<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service unavailable</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #1e1e2e;
            color: #e0e0e0;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        h1 { font-size: 4rem; margin: 0; color: #ff6b6b; }
        h2 { font-weight: 500; margin: .5rem 0 1rem; }
        p  { color: #a0a0b0; max-width: 32rem; margin: 0 auto; }
    </style>
</head>
<body>
    <main>
        <h1>503</h1>
        <h2>Service unavailable</h2>
        <p>The service you are trying to reach is disabled or does not exist on this server.</p>
    </main>
</body>
</html>
