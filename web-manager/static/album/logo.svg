<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Reverse Proxy Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Routes: one incoming connection fanned out to three services -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 92 256 H 178"/>
    <path d="M 300 236 C 340 220, 344 152, 392 152"/>
    <path d="M 316 256 H 392"/>
    <path d="M 300 276 C 340 292, 344 360, 392 360"/>
  </g>

  <!-- Incoming arrow head -->
  <path d="M 150 222 L 188 256 L 150 290" fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Proxy hub -->
  <circle cx="264" cy="256" r="52" fill="#ffffff"/>
  <circle cx="264" cy="256" r="22" fill="#4f46e5"/>

  <!-- Services -->
  <g fill="#ffffff">
    <circle cx="410" cy="152" r="28"/>
    <circle cx="410" cy="256" r="28"/>
    <circle cx="410" cy="360" r="28"/>
  </g>
</svg>
